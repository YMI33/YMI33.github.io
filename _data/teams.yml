# 团队成员
# ============================================================
# 日常维护只有两件事：
#
#   【新生加入】在 members: 下面加一条，group 填 phd / master / undergrad
#   【学生毕业】改三处，条目不要删：
#       1. group  改成 alumni
#       2. end    填毕业年月，例如 "2029-06"
#       3. next_zh / next_en  填毕业去向
#
# 字段说明
#   id       必填，唯一标识，用拼音。稳定主键，定了就别再改
#   group    必填，必须是下面 groups 里出现过的 key，写错会掉进「其他成员」栏
#   start    入学/入职年月，"YYYY-MM"。学生填入学年月（卡片显示为「2026 级」），
#            不是加入课题组的时间；本科生转专业之类的情况按学籍年级填
#            漏填不会报错，只是卡片排到最前且不显示年份
#   end      毕业/离开年月，在读成员留空字符串 ""
#   avatar   照片文件名（放在 images/ 目录下）。留空则不显示照片，不会出现破图
#   bio_*    研究方向，一句话
#   next_*   毕业去向，只有 alumni 用
#
# 排序规则（模板自动处理，不用手动摆顺序）
#   alumni 之外：按 start 升序，高年级在前
#   alumni：按 end 降序，最近毕业的在前
#
# 注意：本文件在公开仓库里，写进来就等于公开。学生邮箱、电话等私人联系方式
#       不要放这里，需要记录请记在自己的本地文档中。
# ============================================================

groups:
  - key: pi
    zh: "导师"
    en: "Principal Investigator"
  - key: phd
    zh: "博士研究生"
    en: "PhD Students"
    cohort: true
  - key: master
    zh: "硕士研究生"
    en: "Master's Students"
    cohort: true
  - key: undergrad
    zh: "本科生"
    en: "Undergraduate Researchers"
    cohort: true
  - key: alumni
    zh: "已毕业"
    en: "Alumni"

